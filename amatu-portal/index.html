<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu · Portal de distribuidores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--vi:#4A2B8E;--vi2:#38206E;--pk:#F4A7C6;--ye:#FFD12E;--or:#F7A26B;--gr:#2E8B6A;--bg:#FAF7FC;--cd:#fff;--tx:#241A33;--mu:#6F6580;--ln:#E7DFEE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F20;--cd:#211833;--tx:#F3ECFA;--mu:#B3A6C6;--ln:#382B52}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--vi);z-index:30}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer}
.b{border:0;border-radius:10px;padding:12px 20px;font-weight:700;background:var(--vi);color:#fff;transition:transform .12s,opacity .12s}
.b:hover{transform:translateY(-1px)}.b:disabled{opacity:.4;transform:none;cursor:not-allowed}
.b.y{background:var(--ye);color:var(--vi2)}.b.g{background:transparent;color:var(--vi);border:1.5px solid var(--ln)}
@media (prefers-color-scheme:dark){.b.g{color:var(--tx)}}
input,textarea{font:inherit;width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--pk);border-color:var(--vi)}
label{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--mu)}
#lg{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--vi)}
.lp{display:grid;place-items:center;padding:24px}.lb{background:var(--cd);border-radius:18px;padding:32px;width:100%;max-width:400px;display:grid;gap:14px}
.wm{font-family:"DM Serif Display",serif;color:var(--vi);font-size:34px;letter-spacing:.04em}
@media (prefers-color-scheme:dark){.wm{color:var(--ye)}}
.err{color:#C0392B;font-size:13px;min-height:18px}
header{background:var(--vi);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hi{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .wm{color:#fff;font-size:24px}header small{opacity:.75;display:block;font-size:11px;letter-spacing:.08em}
nav{max-width:1120px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
nav button{background:none;border:0;color:#fff;opacity:.72;padding:12px 14px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--ye)}
main{max-width:1120px;margin:0 auto;padding:22px 18px 100px}
.hero{background:linear-gradient(120deg,var(--vi),var(--vi2));border-radius:20px;color:#fff;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;overflow:hidden;padding:36px 36px 0}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08}.hero p{opacity:.88;max-width:440px;margin:12px 0 22px}
.col{padding-bottom:36px}.cl{display:flex;gap:12px;align-items:flex-end;justify-content:center}
.cl img{width:31%;border-radius:10px 10px 0 0;box-shadow:0 10px 30px #0006}.cl img:nth-child(2){transform:translateY(-14px)}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:26px 22px 0}.cl{display:none}.col{padding-bottom:26px}}
.gd{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:16px}
.k b{display:block;font-family:"DM Serif Display",serif;font-size:28px;color:var(--vi);font-weight:400}.k span{color:var(--mu);font-size:13px}
@media (prefers-color-scheme:dark){.k b{color:var(--ye)}}
.sec{margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}.sec h2{font-size:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chips button{border:1.5px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:99px;padding:8px 16px;font-weight:700}
.chips button.on{background:var(--vi);color:#fff;border-color:var(--vi)}
.bl{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:900px){.bl{grid-template-columns:1fr}}
.pc{padding:0;overflow:hidden;display:flex;flex-direction:column}
.im{height:210px;display:grid;place-items:center;background:var(--tc,var(--pk));overflow:hidden}.im img{height:100%}
.im span{font-family:"DM Serif Display",serif;font-size:26px;color:var(--vi2);padding:16px;text-align:center}
.pb{padding:14px;display:grid;gap:10px}.pb h3{font-size:19px}.pb small{color:var(--mu)}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--ln);padding-top:10px}
.pr s{color:var(--mu);font-size:12px;display:block}.pr b{font-size:16px}
.st{display:flex;align-items:center;gap:6px}.st button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--ln);background:var(--cd);color:var(--tx);font-weight:700}
.st i{min-width:22px;text-align:center;font-style:normal;font-weight:700}
.sm{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:12px}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0}.ln.t{border-top:1.5px solid var(--ln);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.tl{display:flex;gap:4px;margin:12px 0 6px}.tl i{flex:1;height:6px;border-radius:6px;background:var(--ln)}.tl i.d{background:var(--gr)}.tl i.c{background:var(--ye)}
.tg{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.tag{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--ye);color:var(--vi2)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding-bottom:26px}.bars div{flex:1;background:var(--vi);border-radius:6px 6px 0 0;position:relative;min-height:3px}
.bars small{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:11px;color:var(--mu);margin-top:4px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ms{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--vi2);color:#fff;padding:13px 22px;border-radius:10px;font-weight:700;z-index:40;box-shadow:0 8px 24px #0005}
.mb{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--vi);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;z-index:25}
@media(max-width:900px){.mb.on{display:flex}}
</style></head><body>
<div id="lg"><div class="lp"><div class="lb">
<div class="wm">AMATU</div><div><h2 style="font-size:26px">Portal de distribuidores</h2><p style="color:var(--mu);margin:6px 0 0">Haz tu pedido, programa la entrega y sigue cada etapa en un solo lugar.</p></div>
<label>Correo<input id="em" type="email" autocomplete="username" value=""></label>
<label>Contraseña<input id="pw" type="password" autocomplete="current-password" value=""></label>
<div class="err" id="er"></div><button class="b" id="lb" onclick="login()">Ingresar</button>
<p style="font-size:12px;color:var(--mu);margin:0">Acceso seguro con tu cuenta de distribuidor.</p></div></div></div>
<div id="ap" style="display:none">
<header><div class="hi"><div class="wm">AMATU<small>PORTAL DE DISTRIBUIDORES</small></div><div style="text-align:right"><b id="sn"></b><br><button class="b g" style="padding:4px 12px;color:#fff;border-color:#fff4;font-size:12px" onclick="location.reload()">Cerrar sesión</button></div></div><nav id="nv"></nav></header>
<main id="mn"></main><div class="mb" id="mb"><span id="mt"></span><button class="b y" onclick="go('nuevo')">Ver pedido</button></div></div>

function inicio(){const act=orders.filter(o=>!['delivered','cancelled'].includes(o.status));const k=['MP-RT','MP-PO','MP-SA'];
return `<div class="hero"><div class="col"><h1>Tu pedido, listo en pocos minutos</h1><p>Elige los productos, define la fecha de entrega y sigue cada etapa hasta tu puerta.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b y" style="font-size:17px;padding:15px 28px" onclick="go('nuevo')">Crear pedido</button>${orders[0]?`<button class="b g" style="color:#fff;border-color:#fff6" onclick="rep()">Repetir último pedido</button>`:''}</div></div><div class="cl">${k.map(x=>`<img src="data:image/jpeg;base64,${IMG[x]}" alt="">`).join('')}</div></div>
<div class="sec"><h2>Pedidos en curso</h2><a href="#" onclick="go('seg');return false" style="color:var(--vi);font-weight:700">Ver todos</a></div>
${act.length?act.map(oc).join(''):`<div class="cd" style="color:var(--mu)">No tienes pedidos en curso. Cuando envíes uno, aquí verás cada etapa.</div>`}
<div class="sec"><h2>Tu negocio con Amatu</h2></div>${kp()}`}
function kp(){const v=orders.filter(o=>o.status!='cancelled'),t=v.reduce((a,o)=>a+ +o.total_amount,0),g=v.reduce((a,o)=>a+o.order_items.reduce((b,i)=>b+(i.unit_pvp-i.unit_price)*i.quantity,0),0);
return `<div class="gd"><div class="cd k"><b>${COP(t)}</b><span>Total comprado</span></div><div class="cd k"><b>${COP(g)}</b><span>Ganancia estimada frente al precio público</span></div><div class="cd k"><b>${v.length}</b><span>Pedidos realizados</span></div><div class="cd k"><b>${prof.discount_level}%</b><span>Descuento en alimento cocido</span></div></div>`}
function oc(o){const s=SM[o.status]??0,x=o.status=='cancelled';
return `<div class="cd" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Pedido AM-${String(o.order_number).padStart(6,'0')}</b><span class="tag">${x?'Cancelado':ST[s]}</span></div>
<div class="tl">${ST.map((_,i)=>`<i class="${x?'':i<s||(s==4&&i==4)?'d':i==s?'c':''}"></i>`).join('')}</div><div class="tg">${ST.map(t=>`<span>${t}</span>`).join('')}</div>
<p style="margin:10px 0 0;color:var(--mu)">Entrega solicitada: ${FD(o.requested_delivery_date)}${o.confirmed_delivery_date?' · Confirmada: '+FD(o.confirmed_delivery_date):''} · ${COP(o.total_amount)}</p>
<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700;color:var(--vi)">Ver productos</summary>${o.order_items.map(i=>`<div class="ln"><span>${i.product_name} ${i.presentation}  x ${i.quantity}</span><span>${COP(i.line_total??i.unit_price*i.quantity)}</span></div>`).join('')}</details></div>`}
function seg(){return `<div class="sec" style="margin-top:0"><h2>Mis pedidos</h2></div>${orders.length?orders.map(oc).join(''):`<div class="cd">Aún no tienes pedidos.</div>`}`}
function rep(){cart={};orders[0].order_items.forEach(i=>{const p=cat.find(x=>x.sku==i.sku_snapshot);if(p)cart[p.id]=i.quantity});go('nuevo')}
function nuevo(){const L=['Todos','Meat Power','Senior Light','Hepatic Care','Complementos'],G=groups().filter(g=>ln=='Todos'||g.line==ln);
return `<div class="sec" style="margin-top:0"><h2>Crear pedido</h2><span style="color:var(--mu)">Precios de distribuidor</span></div>
<div class="chips">${L.map(l=>`<button class="${l==ln?'on':''}" onclick="ln='${l}';R()">${l}</button>`).join('')}</div>
<div class="bl"><div class="gd" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${G.map(card).join('')}</div>${panel()}</div>`}
function card(g){return `<div class="cd pc"><div class="im" style="--tc:${g.line=='Hepatic Care'?'#E8D8F5':TC[g.c]||'#F3ECFA'}">${g.img?`<img src="data:image/jpeg;base64,${g.img}" alt="${g.name}">`:`<span>${g.name}</span>`}</div>
<div class="pb"><div><small>${g.line}</small><h3>${g.name}</h3></div>${g.items.map(p=>`<div class="pr"><div><b>${COP(unit(p))}</b><s>Público ${COP(p.pvp)}</s><small>${p.presentation}</small></div><div class="st"><button onclick="ch('${p.id}',-1)">-</button><i>${cart[p.id]||0}</i><button onclick="ch('${p.id}',1)">+</button></div></div>`).join('')}</div></div>`}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];const y=scrollY;R();scrollTo(0,y)}
function panel(){const s=sub(),e=Object.entries(cart),d=new Date();d.setDate(d.getDate()+2);const mn=d.toISOString().slice(0,10),g=e.reduce((a,[i,q])=>{const p=cat.find(x=>x.id==i);return a+(p.pvp-unit(p))*q},0);
return `<div class="cd sm"><h3 style="font-size:22px">Resumen del pedido</h3>${e.length?e.map(([i,q])=>{const p=cat.find(x=>x.id==i);return `<div class="ln"><span>${p.name} ${PN[p.sku.split('-')[1]]||''} ${p.presentation}  x ${q}</span><span>${COP(unit(p)*q)}</span></div>`}).join(''):`<p style="color:var(--mu);margin:0">Agrega productos para comenzar.</p>`}
<div class="ln"><span>Subtotal</span><span>${COP(s)}</span></div><div class="ln"><span>Envío</span><span>${COP(e.length?12000:0)}</span></div><div class="ln t"><span>Total</span><span>${COP(e.length?s+12000:0)}</span></div>
<div class="ln" style="color:var(--gr)"><span>Ganancia estimada</span><span>${COP(g)}</span></div>
<label>Fecha tentativa de entrega<input id="fd" type="date" min="${mn}" value="${mn}"></label><label>Dirección de entrega<input id="ad" value="${prof.delivery_address||''}"></label><label>Notas (opcional)<textarea id="nt" rows="2"></textarea></label>
<div class="err" id="oe"></div><button class="b" ${e.length?'':'disabled'} onclick="send()">Enviar pedido</button><p style="font-size:12px;color:var(--mu);margin:0">Entregas de 8 a. m. a 5 p. m., 48 a 72 horas después del pedido. Guarda el producto en congelador al recibirlo.</p></div>`}
async function send(){const fd=$('#fd').value,ad=$('#ad').value.trim(),nt=$('#nt').value;if(ad.length<8){$('#oe').textContent='Escribe una dirección de entrega completa.';return}
try{if(LIVE){const{error}=await sb.rpc('create_distributor_order',{p_items:Object.entries(cart).map(([i,q])=>({product_id:i,quantity:q})),p_requested_delivery_date:fd,p_delivery_address:ad,p_notes:nt||null});if(error)throw error;await ords()}
else{const it=Object.entries(cart).map(([i,q])=>{const p=cat.find(x=>x.id==i);return{product_name:p.name,presentation:p.presentation,quantity:q,unit_pvp:p.pvp,unit_price:unit(p),sku_snapshot:p.sku}});const s=sub(),n=Math.max(...orders.map(o=>o.order_number))+1;
orders.unshift({id:n,order_number:n,created_at:new Date().toISOString(),requested_delivery_date:fd,status:'requested',subtotal:s,shipping_amount:12000,total_amount:s+12000,order_items:it,order_status_history:[]})}
cart={};ms('Pedido enviado. Ya puedes seguirlo en Mis pedidos.');go('seg')}catch(x){$('#oe').textContent='No pudimos enviar el pedido. Intenta de nuevo.'}}
function res(){const m={};orders.filter(o=>o.status!='cancelled').forEach(o=>{const k=o.created_at.slice(0,7);m[k]=(m[k]||0)+ +o.total_amount});const ks=Object.keys(m).sort().slice(-6),mx=Math.max(1,...ks.map(k=>m[k]));
return `<div class="sec" style="margin-top:0"><h2>Resumen de tu negocio</h2></div>${kp()}<div class="sec"><h2>Compras por mes</h2></div><div class="cd"><div class="bars">${ks.map(k=>`<div style="height:${m[k]/mx*100}%"><small>${k.slice(5)}/${k.slice(2,4)}<br>${COP(m[k])}</small></div>`).join('')}</div></div>
<div class="sec"><h2>Historial</h2></div><div class="cd tb"><table><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th></tr>${orders.map(o=>`<tr><td>AM-${String(o.order_number).padStart(6,'0')}</td><td>${FD(o.created_at)}</td><td>${COP(o.total_amount)}</td><td>${ST[SM[o.status]??0]}</td></tr>`).join('')}</table></div>`}
function ben(){const B=[['Margen en alimento','Descuento sobre el precio público en alimento cocido, con condiciones claras para tu negocio.'],['Snacks con mayor margen','Galletas, helados, turrones y pescaditos con márgenes altos para aumentar tu ticket.'],['Cadena de frío','Entrega programada con seguimiento de cada etapa.'],['Material de punto de venta','Pendones, volantes y contenido para tus redes.'],['Capacitación','Formación para que tu equipo recomiende Amatu con confianza.'],['Planta propia en Bogotá','Producción con trazabilidad y registro ICA.']];
return `<div class="sec" style="margin-top:0"><h2>Beneficios de ser distribuidor Amatu</h2></div><div class="gd">${B.map(([t,d])=>`<div class="cd"><h3 style="font-size:20px;color:var(--vi)">${t}</h3><p style="color:var(--mu);margin:8px 0 0">${d}</p></div>`).join('')}</div>`}
function ms(t){const e=document.createElement('div');e.className='ms';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
</script></body></html>
